<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f6f43">
<title>Baum-Tour Fahrer</title>
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --text:#17201b; --muted:#5f6d65; --line:#dde3dc;
  --accent:#1f6f43; --accent-2:#2c8a56; --ok:#15803d; --ok-bg:#dcfce7; --bad:#b91c1c; --bad-bg:#fee2e2;
  --warn:#92400e; --warn-bg:#fef3c7; --next:#2563eb; --next-bg:#eff6ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1512; --card:#18211c; --text:#e8efe9; --muted:#9aaba1; --line:#2a362f;
    --accent:#2c8a56; --accent-2:#36a366; --ok:#4ade80; --ok-bg:#12301e; --bad:#f87171; --bad-bg:#3a1515;
    --warn:#fcd34d; --warn-bg:#3a2e0b; --next:#60a5fa; --next-bg:#14233a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1512; --card:#18211c; --text:#e8efe9; --muted:#9aaba1; --line:#2a362f;
  --accent:#2c8a56; --accent-2:#36a366; --ok:#4ade80; --ok-bg:#12301e; --bad:#f87171; --bad-bg:#3a1515;
  --warn:#fcd34d; --warn-bg:#3a2e0b; --next:#60a5fa; --next-bg:#14233a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--accent);color:#fff;padding:12px 16px calc(10px);padding-top:calc(12px + env(safe-area-inset-top))}
header .row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:19px;margin:0}
header .sub{font-size:13px;opacity:.9;margin-top:2px}
.bar{height:6px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:0;transition:width .3s}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;font-size:18px;padding:6px 10px}
main{padding:12px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.stop.next{border:2px solid var(--next);background:var(--next-bg)}
.stop.done{opacity:.6}
.stop .head{display:flex;gap:10px;align-items:flex-start}
.num{min-width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:16px}
.stop.next .num{background:var(--next)}
.stop.done .num{background:var(--muted)}
.addr{font-size:18px;font-weight:700;line-height:1.25}
.city{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;margin:4px 4px 0 0}
.tag.next{background:var(--next);color:#fff}
.tag.inv{background:var(--warn-bg);color:var(--warn)}
.tag.eta{background:var(--line);color:var(--text)}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:10px}
.acts .btn{white-space:nowrap;font-size:15px;padding:8px 4px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;text-decoration:none;padding:8px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[disabled]{opacity:.4}
.tree{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.tree .t1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tree .nr{font-size:20px;font-weight:800}
.tree .name{color:var(--muted);font-size:14px;text-align:right}
.hint{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:6px 8px;font-size:14px;margin-top:6px}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.st .btn.on-z{background:var(--ok);border-color:var(--ok);color:#fff}
.st .btn.on-n{background:var(--bad);border-color:var(--bad);color:#fff}
.note{margin-top:8px}
.note input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:14px;text-decoration:underline;padding:6px 0;cursor:pointer}
details.card summary{font-weight:700;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--line);border-radius:8px;padding:4px 8px;font-size:14px}
.chip b{font-size:16px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:10}
footer .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
footer .prog{font-size:14px;color:var(--muted);flex:1}
footer .prog b{color:var(--text);font-size:18px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tabs button{font-size:15px;font-weight:600;padding:8px;border-radius:8px;background:rgba(255,255,255,.15)}
.tabs button.on{background:#fff;color:var(--accent)}
#mapView{position:fixed;left:0;right:0;z-index:5}
#map{position:absolute;inset:0;background:var(--line)}
.mapbtns{position:absolute;right:12px;top:12px;z-index:500;display:grid;gap:8px}
.mapbtns button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.maplegend{position:absolute;left:8px;bottom:26px;z-index:500;background:var(--card);color:var(--text);border-radius:8px;padding:4px 8px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.25);display:flex;flex-wrap:wrap;gap:4px 8px;max-width:calc(100% - 16px)}
.maplegend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px}
.maptop{position:absolute;left:12px;top:12px;z-index:500;display:grid;gap:6px;justify-items:start}
.rtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.25);overflow:hidden;border:1px solid var(--line)}
.rtoggle button{border:0;background:none;color:var(--text);font:inherit;font-size:14px;font-weight:600;padding:9px 12px}
.rtoggle button.on{background:var(--accent);color:#fff}
.roadinfo{background:var(--card);color:var(--text);border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.roadinfo .linkbtn{padding:0 0 0 4px;font-size:13px}
.ptag{display:inline-block;background:var(--warn-bg);color:var(--warn);font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin-top:4px}
.ptree{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.phint{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:3px 6px;font-size:12px;margin-top:4px}
.pst{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.pp .pst .btn{min-height:42px;margin-top:0;font-size:13px;padding:4px}
.pp .btn.on-z{background:var(--ok);border-color:var(--ok);color:#fff}
.pp .btn.on-n{background:var(--bad);border-color:var(--bad);color:#fff}
.pp .linkbtn{display:block;margin-top:4px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--text)}
.pin{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.pin.open{background:#1f6f43}.pin.next{background:#2563eb;transform:scale(1.25)}.pin.z{background:#6b7280}.pin.n{background:#b91c1c}.pin.dep{background:#facc15;color:#111;border-color:#111}
.me{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
.leaflet-popup-content{margin:10px 12px;font:14px/1.35 system-ui,-apple-system,sans-serif}
.pp .btn{min-height:40px;margin-top:6px;font-size:14px}
.pp .t{font-weight:700;font-size:15px}
.netinfo{font-size:12px;color:var(--muted)}
.netinfo.err{color:var(--bad)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .in{background:var(--card);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 8px;font-size:18px}
.sheet textarea{width:100%;min-height:150px;font:14px/1.4 ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.menu{display:grid;gap:8px;margin-top:8px}
.msg{text-align:center;padding:40px 16px}
.msg h2{margin:0 0 8px}
.small{font-size:13px;color:var(--muted)}
select{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);width:100%}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="row1">
    <div><h1 id="title">Tour</h1><div class="sub" id="subtitle"></div></div>
    <button id="btnSettings" aria-label="Einstellungen">⚙</button>
  </div>
  <div class="tabs" id="tabs"><button data-tab="list" class="on">📋 Liste</button><button data-tab="map">🗺 Karte</button></div>
  <div class="bar"><i id="barFill"></i></div>
</header>
<main id="main"></main>
<div id="mapView" hidden><div id="map"></div>
  <div class="maptop"><div class="rtoggle" id="rtoggle"><button data-rt="line">Luftlinie</button><button data-rt="road">Straße</button></div>
    <div class="roadinfo" id="roadInfo" hidden></div></div>
  <div class="mapbtns"><button id="btnLocate" title="Eigenen Standort anzeigen (wird nicht übertragen)">📍</button><button id="btnFit" title="Ganze Tour anzeigen">⤢</button></div>
  <div class="maplegend"><span><i style="background:var(--next)"></i>als Nächstes</span><span><i style="background:var(--accent)"></i>offen</span><span><i style="background:#6b7280"></i>zugestellt</span><span><i style="background:var(--bad)"></i>nicht angetroffen</span></div>
</div>
<footer id="ftr" hidden>
  <div class="in">
    <div class="prog"><div id="prog"></div><div id="net" class="netinfo"></div></div>
    <button class="btn primary" id="btnReport">Rückmeldung senden</button>
  </div>
</footer>

<div class="sheet" id="sheet" hidden><div class="in" id="sheetIn"></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };
const save = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

function decode(){
  const h = location.hash.slice(1);
  if(!h.startsWith('z=')) return null;
  try{ const j = LZString.decompressFromEncodedURIComponent(h.slice(2)); return j ? JSON.parse(j) : 'bad'; }catch(e){ return 'bad'; }
}
const hashStr = s => { let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h + s.charCodeAt(i)) | 0; return (h>>>0).toString(36); };

/* ---------- Verschlüsselung für den Live-Rückkanal (AES-GCM, Schlüssel nur im Link und im Planer) ---------- */
const b64u = {
  enc: buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
  dec: s => { s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
};
const aesKey = k => crypto.subtle.importKey('raw', b64u.dec(k), 'AES-GCM', false, ['encrypt','decrypt']);
async function encryptMsg(k, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await aesKey(k), new TextEncoder().encode(JSON.stringify(obj)));
  const out = new Uint8Array(12 + ct.byteLength); out.set(iv); out.set(new Uint8Array(ct), 12);
  return 'BT1.' + b64u.enc(out);
}
async function decryptMsg(k, txt){
  if(typeof txt !== 'string' || !txt.startsWith('BT1.')) return null;
  const b = b64u.dec(txt.slice(4));
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b.slice(0,12)}, await aesKey(k), b.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
const NTFY = 'https://ntfy.sh/';

const T = decode();
const KEY = 'bt_' + hashStr(location.hash);
let S = load(KEY, {st:{}, notes:{}});               // st[nr] = 'z' (zugestellt) | 'n' (nicht angetroffen)
let pref = load('bt_pref', {nav:'google'});
const persist = () => save(KEY, S);

/* ---------- Live-Rückkanal ---------- */
const NET = T && typeof T === 'object' && T.nt && T.nk && window.crypto?.subtle ? {topic:T.nt, key:T.nk} : null;
let outbox = load(KEY + '_out', []), flushTimer = null, flushing = false, netOk = null;
function enqueue(ev){
  if(!NET) return;
  outbox.push({...ev, i: Math.random().toString(36).slice(2,10) + Date.now().toString(36), t: T.t, a: Date.now()});
  save(KEY + '_out', outbox); scheduleFlush(1200);
}
function scheduleFlush(ms){ if(!NET) return; clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); renderNet(); }
async function flush(){
  if(!NET || flushing || !outbox.length) return renderNet();
  flushing = true;
  const batch = outbox.slice(0, 30);
  try{
    const body = await encryptMsg(NET.key, {v:1, e:batch}), url = NTFY + NET.topic;
    try{ const r = await fetch(url, {method:'POST', body}); if(!r.ok) throw new Error('HTTP ' + r.status); }
    catch(e){ if(String(e.message).startsWith('HTTP')) throw e; await fetch(url, {method:'POST', body, mode:'no-cors'}); }
    const sent = new Set(batch.map(b => b.i));
    outbox = outbox.filter(e => !sent.has(e.i)); save(KEY + '_out', outbox); netOk = true;
  }catch(e){ netOk = false; }
  flushing = false; renderNet();
  if(outbox.length) scheduleFlush(netOk ? 300 : 20000);
}
function renderNet(){
  const el = $('net'); if(!el) return;
  if(!NET){ el.textContent = ''; return; }
  el.className = 'netinfo' + (netOk === false && outbox.length ? ' err' : '');
  el.textContent = outbox.length ? (netOk === false ? `📡 ${outbox.length} Meldung(en) warten auf Netz` : `📡 sende …`) : (netOk ? '📡 live übertragen ✓' : '📡 Live-Meldung aktiv');
}

const hasGeo = s => s[5] != null && s[6] != null;
function stopState(s){ if(!stopDone(s)) return 'open'; return s[4].every(t => S.st[t[0]] === 'n') ? 'n' : 'z'; }
let markers = [], openIdx = null;
function popupHtml(i){

function renderMap(fit){
  if(!map) return;

  mapLayer.clearLayers(); markers = [];
  const nextIdx = T.s.findIndex(s => !stopDone(s));

  if(T.dl) L.marker(T.dl, {icon:L.divIcon({className:'', html:'<div class="pin dep">D</div>', iconSize:[30,30], iconAnchor:[15,15]})})
    .bindPopup(`<div class="pp"><div class="t">Depot</div>${esc(T.dep||'')}<a class="btn primary" href="${esc(navUrl(T.dep||''))}" target="_blank" rel="noopener">🧭 Navigieren</a></div>`).addTo(mapLayer);
  T.s.forEach((s, i) => {
    if(!hasGeo(s)) return;
    const stt = i === nextIdx ? 'next' : stopState(s);
    const icon = L.divIcon({className:'', html:`<div class="pin ${stt}">${stt==='z'?'✓':stt==='n'?'✗':i+1}</div>`, iconSize:[30,30], iconAnchor:[15,15]});
    const m = L.marker([s[5], s[6]], {icon, zIndexOffset: stt==='next' ? 1000 : stt==='open' ? 500 : 0})
      .bindPopup(() => popupHtml(i), {minWidth:230, maxWidth:280, autoPanPaddingTopLeft:[10,60]}).addTo(mapLayer);
    m.on('popupopen', () => { openIdx = i; });
    m.on('popupclose', () => { if(openIdx === i) openIdx = null; });
    markers[i] = m;
  });

}

// Straßenroute: wird auf dem Fahrer-Handy selbst berechnet (OSRM) und zwischengespeichert
pref.route ??= 'line';
let road = load(KEY + '_road', null), roadLoading = false, roadErr = '';
const ROUTERS = ['https://router.project-osrm.org', 'https://routing.openstreetmap.de/routed-car'];
async function osrmGet(path){
  let last;
  for(const base of ROUTERS){
    try{ const r = await fetch(base + path); if(!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json(); if(j.code === 'Ok') return j; throw new Error(j.message || j.code); }
    catch(e){ last = e; }
  }
  throw last;
}
function routePts(){
  const gi = T.s.map((s,i) => hasGeo(s) ? i : -1).filter(i => i >= 0);
  const pts = gi.map(i => [T.s[i][5], T.s[i][6]]);
  return T.dl ? {pts:[T.dl, ...pts, T.dl], ends:[...gi, 'D']} : {pts, ends:gi.slice(1)};   // ends[k] = Ziel von Abschnitt k
}
async function loadRoad(){
  const {pts} = routePts(), sig = pts.map(p => p.join(',')).join(';');
  if(road && road.sig === sig) return;
  roadLoading = true; roadErr = ''; renderRoadInfo();
  try{
    const j = await osrmGet(`/route/v1/driving/${pts.map(p => p[1] + ',' + p[0]).join(';')}?overview=false&steps=true&geometries=geojson`);
    const thinL = (a, max) => { if(a.length <= max) return a; const k = Math.ceil(a.length / max); return a.filter((p,i) => i % k === 0 || i === a.length - 1); };
    road = {sig, legs: j.routes[0].legs.map(l => thinL(l.steps.flatMap(st => st.geometry.coordinates.map(c => [+c[1].toFixed(5), +c[0].toFixed(5)])), 200)),
            dur: j.routes[0].legs.map(l => Math.round(l.duration))};
    save(KEY + '_road', road);
  }catch(e){ roadErr = e.message || 'nicht erreichbar'; }
  roadLoading = false; renderMap(false);
}
function drawRoute(nextIdx){
  const {pts, ends} = routePts();
  const useRoad = pref.route === 'road' && road && road.sig === pts.map(p => p.join(',')).join(';');
  if(pref.route === 'road' && !useRoad && !roadLoading && !roadErr) loadRoad();
  if(!useRoad){
    if(pts.length > 1) L.polyline(pts, {color:'#2563eb', weight:3, opacity:.55, dashArray:'6 6', interactive:false}).addTo(mapLayer);
  } else {
    road.legs.forEach((leg, k) => {
      const e = ends[k], done = e !== 'D' && stopDone(T.s[e]), isNext = e === nextIdx || (e === 'D' && nextIdx < 0);
      L.polyline(leg, done ? {color:'#6b7280', weight:4, opacity:.45, interactive:false}
                           : {color:'#2563eb', weight: isNext ? 7 : 5, opacity: isNext ? .95 : .7, interactive:false}).addTo(mapLayer);
    });
  }
  renderRoadInfo(useRoad ? ends : null);
}
function renderRoadInfo(ends){
  document.querySelectorAll('#rtoggle button').forEach(b => b.classList.toggle('on', b.dataset.rt === pref.route));
  const el = $('roadInfo');
  if(pref.route !== 'road'){ el.hidden = true; return; }
  el.hidden = false;
  if(roadLoading) el.textContent = '🚗 Route wird berechnet …';
  else if(roadErr) el.innerHTML = `⚠ Route nicht verfügbar (${esc(roadErr)}) <button class="linkbtn" id="roadRetry">Erneut</button>`;
  else if(ends && road){
    const rest = road.dur.reduce((a, d, k) => a + (ends[k] === 'D' || !stopDone(T.s[ends[k]]) ? d : 0), 0);
    el.textContent = `🚗 noch ca. ${rest < 3600 ? Math.round(rest/60) + ' min' : Math.floor(rest/3600) + ' h ' + String(Math.round(rest%3600/60)).padStart(2,'0') + ' min'} Fahrt`;
  }
}
function fitMap(){
  const open = T.s.filter(s => hasGeo(s) && !stopDone(s)).map(s => [s[5], s[6]]);
  const all = T.s.filter(hasGeo).map(s => [s[5], s[6]]);
  const pts = open.length ? open : all; if(T.dl) pts.push(T.dl);
  if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.12), {maxZoom:16});
}
async function showTab(tab){
  pref.tab = tab; save('bt_pref', pref);
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const isMap = tab === 'map';
  $('mapView').hidden = !isMap; $('main').hidden = isMap;
  if(!isMap) return;
  placeMapView();
  if(!T.s.some(hasGeo)){ $('map').innerHTML = '<div class="msg small">Für diese Tour sind keine Kartendaten im Link. Bitte einen neuen Link anfordern.</div>'; return; }
  try{ await loadLeaflet(); }catch(e){ $('map').innerHTML = `<div class="msg small">${esc(e.message)}. Bitte Internetverbindung prüfen.</div>`; return; }
  if(!map){
    map = L.map('map', {zoomControl:false});
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {maxZoom:19, attribution:'Tiles © Esri'}).addTo(map);
    mapLayer = L.layerGroup().addTo(map);
    renderMap(true);
  } else { map.invalidateSize(); renderMap(false); }
}

window.addEventListener('resize', () => { if(!$('mapView').hidden) placeMapView(); });

/* ---------- Start ---------- */
if(T === null) message('Baum-Tour Fahrer-Ansicht', 'Diese Seite zeigt Liefertouren für Fahrer. Bitte den Link oder QR-Code aus dem Tourenplaner öffnen.');
else if(T === 'bad' || !T.s) message('Link unvollständig', 'Der Link konnte nicht gelesen werden. Wahrscheinlich wurde er beim Kopieren abgeschnitten. Bitte den Link neu anfordern.');
else if(T.exp && Date.now() > Date.parse(T.exp)) message('Link abgelaufen', 'Dieser Tour-Link ist nicht mehr gültig. Bitte bei der Einsatzleitung einen neuen Link anfordern.');
else {
  document.title = `Tour ${T.t} – Baum-Tour`;
  $('title').textContent = `Tour ${T.t}${T.d ? ' · '+T.d : ''}`;
  const n = allTrees().length;
  $('subtitle').textContent = `${T.s.length} Stopps · ${n} Bäume${T.at ? ' · Stand ' + new Date(T.at).toLocaleString('de-DE',{weekday:'short',hour:'2-digit',minute:'2-digit'}) : ''}`;
  $('hdr').hidden = false; $('ftr').hidden = false;
  render(); renderNet(); if(outbox.length) scheduleFlush(500);
  if(pref.tab === 'map') showTab('map');
}
</script>
</body>
</html>
